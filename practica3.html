<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
<body>

<h2>HTML Image</h2>
<img src="img/pic_trulli.jpg" alt="Descripción de la imagen">
<h2>Setting the Viewport</h2>
<p>This example does not really do anything, other than showing you how to add the viewport meta element.</p>
<picture>
  <source media="(min-width: 650px)" srcset="img/img_food.jpg">
  <source media="(min-width: 465px)" srcset="img/img_car.jpg">
  <img src="img/img_girl.jpg">
</picture>
</body>
</html>
